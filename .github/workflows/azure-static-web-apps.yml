# Deploys the Vue client to Azure Static Web Apps.
# Build + upload run in GitHub-hosted CI (full internet), which avoids the
# locked-down local npm feed and needs no swa CLI on a dev machine.
name: Deploy client to Azure Static Web Apps

on:
  push:
    branches: [master]
    paths:
      - "EggLedger.Client/**"
      - ".github/workflows/azure-static-web-apps.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Paths are relative to the repo root.
          app_location: "EggLedger.Client"
          output_location: "dist"
          skip_api_build: true
        env:
          # Baked into the bundle at build time; must point at the deployed API.
          # Set as a repository variable (Settings > Secrets and variables > Actions > Variables).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
